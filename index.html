<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My FNF Arcade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container to manage fullscreen targeting easily */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        iframe {
            width: 960px;
            height: 540px;
            border: 3px solid #ff007f;
            border-radius: 8px;
            box-shadow: 0px 0px 20px rgba(255, 0, 127, 0.4);
            background-color: #000;
        }

        .fullscreen-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .fullscreen-btn:hover {
            background-color: #ff3399;
            transform: scale(1.05);
        }

        .fullscreen-btn:active {
            transform: scale(0.95);
        }

        /* Adjusts iframe size automatically when in fullscreen mode */
        :fullscreen iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
        }
        
        /* Hides the button when the container is in full screen */
        :fullscreen .fullscreen-btn {
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-container" id="arcadeContainer">
        <!-- The Embedded Game -->
        <iframe 
            src="https://fnf-2.io" 
            allow="autoplay; keyboard; fullscreen"
            allowfullscreen
            title="Friday Night Funkin">
        </iframe>

        <!-- Your Custom Fullscreen Button -->
        <button class="fullscreen-btn" onclick="openFullscreen()">Go Fullscreen</button>
    </div>

    <script>
        function openFullscreen() {
            var elem = document.getElementById("arcadeContainer");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
